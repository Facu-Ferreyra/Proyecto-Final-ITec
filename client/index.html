<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyBot · Tu chatbot en minutos, sin programar</title>
    <meta
      name="description"
      content="Creá el chatbot de tu negocio en minutos: elegí una plantilla, cargá tus datos y compartí el link. Tus clientes consultan horarios, precios, turnos y pedidos al instante."
    />
    <meta name="theme-color" content="#23408e" />

    <!-- Íconos -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- OpenGraph (vista previa al compartir en WhatsApp, Facebook, LinkedIn).
         %SITE_URL% lo reemplaza vite.config.js: las redes exigen URLs absolutas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EasyBot" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="EasyBot · Tu chatbot en minutos, sin programar" />
    <meta
      property="og:description"
      content="Elegí una plantilla, cargá los datos de tu negocio y compartí el link. Sin programar."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EasyBot: tu chatbot en minutos, sin programar" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EasyBot · Tu chatbot en minutos, sin programar" />
    <meta
      name="twitter:description"
      content="Elegí una plantilla, cargá los datos de tu negocio y compartí el link. Sin programar."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
